name: Solver checks

on:
  push:
    paths:
      - "src/heatuq/solver.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/convergence.yml"
  pull_request:
    paths:
      - "src/heatuq/solver.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/convergence.yml"

jobs:
  solver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest tests/ -v
